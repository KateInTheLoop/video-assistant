name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Secret scan (hard credential check)
        run: python3 -I scripts/check_secrets.py
      - name: Tests
        run: node --test tests/
      - name: Build package (smoke)
        run: node scripts/build.mjs
